<!DOCTYPE html> 
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>
    <link rel="stylesheet" href="./03-tugas-style.css">
</head>
<body>
   
   <h1 class="page-title">Pemutar Media Kuliah Responsif</h1> 

   <article class="media-card">

      <picture class="media-card_cover"> 
        <source media="(min-width: 700px)" srcset="assets/images/cover-desktop.webp" type="image/webp"> 
        <source media="(max-width: 699px)" srcset="assets/images/cover-mobile.webp" type="image/webp">
        <img src="assets/images/cover-fallback.jpg" alt="Ilustrasi sampul materi Dasar Client-Side Logic">
      </picture> 

      <div class="media-card__content">
      <h2 class="media-card__title">Video Ajar: Dasar Client-Side Logic</h2>
      <p class="media-card__description">
        Materi video di atas menjelaskan bagaimana browser memproses berkas
        JavaScript secara asinkronus setelah DOM Tree terbentuk.
      </p> 

      <video class="media-card__video" controls poster="assets/videos/poster.jpg">
        <source src="assets/videos/demo.webm" type="video/webm">
        <source src="assets/videos/demo.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutar video HTML5 natif. 
        Silakan <a href="assets/videos/demo.mp4">unduh berkas ini</a>
       </video>


       <h3 class="media-card__audio-label">Dengarkan Penjelasan Audio</h3>
        <audio class="media-card__audio" controls preload="metadata">
          <source src="assets/audios/penjelasan.ogg" type="audio/ogg">
          <source src="assets/audios/penjelasan.mp3" type="audio/mpeg">
          Browser Anda tidak mendukung pemutar audio HTML5 natif. 
          Silakan <a href="assets/audios/penjelasan.mp3">unduh berkas ini</a>
        </audio>
        </div>
        </article>
